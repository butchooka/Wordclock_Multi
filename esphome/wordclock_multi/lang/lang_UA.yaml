# lang_UA.yaml - Wordclock 16x16, ESPHome language package UA (Українська), v0.9
# Device name, hotspot, location (capital), entity names and options.
# Grid and time words: ${src_dir}/wc_lang_UA.h (shared with the Arduino variant).
# Every value can be overwritten in wordclock_multi.yaml under substitutions (e.g. name, latitude).
substitutions:
  lang_code: UA
  name: slovohodynnyk
  friendly_name: SlovoHodynnyk
  ap_ssid: SlovoHodynnyk Fallback
  latitude: "50.450°"           # Київ (Kyiv)
  longitude: "30.523°"
  extra_hidden: "false"         # language has extra words (СЛАВА УКРАЇНІ - ГЕРОЯМ СЛАВА), switch shown

  # entity names
  t_br_day: Яскравість вдень
  t_br_night: Яскравість вночі
  t_cur_limit: Обмеження струму
  t_night_start: Зсув початку ночі
  t_night_end: Зсув кінця ночі
  t_night_mode: Нічний режим
  nm_mix: Змішаний
  nm_sun: Положення сонця
  nm_fixed: Фіксований час
  t_night_not_before: Ніч не раніше
  t_night_not_after: Ніч не пізніше
  t_night_from: Ніч від
  t_night_until: Ніч до
  t_fx_dur: Тривалість ефекту
  t_blink_cycle: Цикл блимання
  t_tin_min: Температура в приміщенні мін
  t_tin_max: Температура в приміщенні макс
  t_tout_min: Температура надворі мін
  t_tout_max: Температура надворі макс
  t_col_time: Колір часу
  t_col_vent: Показувати ПРОВІТРИ
  t_col_alarm: Показувати ТРИВОГА
  t_col_battery: Показувати ЗАРЯД
  t_col_tout: Показувати температуру надворі
  t_col_tin: Показувати температуру в приміщенні
  t_sw_min: Показувати окремі хвилини
  t_sw_extra: Показувати СЛАВА УКРАЇНІ
  t_fx: Ефект
  t_fx_color: Колір ефекту
  t_fx_start: Запустити ефект
  t_fx_stop: Зупинити ефект
  t_text: Біжучий рядок
  t_text_start: Показати текст

  # colour options (palette order, never change the order; c_off = additional display off)
  c_off: "Вимк."
  c_0: Теплий білий
  c_1: Білий
  c_2: Червоний
  c_3: Помаранчевий
  c_4: Жовтий
  c_5: Зелений
  c_6: Синій
  c_7: Фіолетовий
  c_random: Випадковий
  c_temp: Температура
  c_pride: Pride

  # effect names (order of WC_FX in wc_effects.h)
  fx_rainbow: Веселка
  fx_aurora: Полярне сяйво
  fx_matrix: Матриця
  fx_fire: Вогонь
  fx_confetti: Конфеті
  fx_stars: Зоряне небо
  fx_blink: Блимання

esphome:
  includes:
    - ${src_dir}/wc_lang_UA.h
