# lang_RO.yaml - Wordclock 16x16, ESPHome language package RO (Română), v0.9
# Device name, hotspot, location (capital), entity names and options.
# Grid and time words: ${src_dir}/wc_lang_RO.h (shared with the Arduino variant).
# Every value can be overwritten in wordclock_multi.yaml under substitutions (e.g. name, latitude).
substitutions:
  lang_code: RO
  name: ceascucuvinte
  friendly_name: CeasCuCuvinte
  ap_ssid: CeasCuCuvinte Fallback
  latitude: "44.427°"           # București
  longitude: "26.103°"
  extra_hidden: "false"         # language has extra words (TIMPUL ZBOARĂ), switch shown

  # entity names
  t_br_day: Luminozitate zi
  t_br_night: Luminozitate noapte
  t_cur_limit: Limită de curent
  t_night_start: Decalaj început noapte
  t_night_end: Decalaj sfârșit noapte
  t_night_mode: Mod noapte
  nm_mix: Mixt
  nm_sun: Poziția soarelui
  nm_fixed: Ore fixe
  t_night_not_before: Noaptea nu înainte de
  t_night_not_after: Noaptea nu după
  t_night_from: Noaptea de la
  t_night_until: Noaptea până la
  t_fx_dur: Durata efectului
  t_blink_cycle: Ciclu de clipire
  t_tin_min: Temperatură interioară min
  t_tin_max: Temperatură interioară max
  t_tout_min: Temperatură exterioară min
  t_tout_max: Temperatură exterioară max
  t_col_time: Culoare oră
  t_col_vent: Afișează AERISIRE
  t_col_alarm: Afișează ALARMĂ
  t_col_battery: Afișează BAT
  t_col_tout: Afișează temperatura exterioară
  t_col_tin: Afișează temperatura interioară
  t_sw_min: Afișează minutele individuale
  t_sw_extra: Afișează TIMPUL ZBOARĂ
  t_fx: Efect
  t_fx_color: Culoare efect
  t_fx_start: Pornește efectul
  t_fx_stop: Oprește efectul
  t_text: Text defilant
  t_text_start: Afișează textul

  # colour options (palette order, never change the order; c_off = additional display off)
  c_off: "Oprit"
  c_0: Alb cald
  c_1: Alb
  c_2: Roșu
  c_3: Portocaliu
  c_4: Galben
  c_5: Verde
  c_6: Albastru
  c_7: Violet
  c_random: Aleatoriu
  c_temp: Temperatură
  c_pride: Pride

  # effect names (order of WC_FX in wc_effects.h)
  fx_rainbow: Curcubeu
  fx_aurora: Aurora boreală
  fx_matrix: Matrix
  fx_fire: Foc
  fx_confetti: Confetti
  fx_stars: Cer înstelat
  fx_blink: Clipire

esphome:
  includes:
    - ${src_dir}/wc_lang_RO.h
