# lang_CZ.yaml - Wordclock 16x16, ESPHome language package CZ (Čeština), v0.9
# Device name, hotspot, location (capital), entity names and options.
# Grid and time words: ${src_dir}/wc_lang_CZ.h (shared with the Arduino variant).
# Every value can be overwritten in wordclock_multi.yaml under substitutions (e.g. name, latitude).
substitutions:
  lang_code: CZ
  name: slovnihodiny
  friendly_name: SlovniHodiny
  ap_ssid: SlovniHodiny Fallback
  latitude: "50.076°"           # Praha
  longitude: "14.438°"
  extra_hidden: "false"         # language has extra words (ČAS LETÍ), switch shown

  # entity names
  t_br_day: Jas ve dne
  t_br_night: Jas v noci
  t_cur_limit: Omezení proudu
  t_night_start: Posun začátku noci
  t_night_end: Posun konce noci
  t_night_mode: Noční režim
  nm_mix: Smíšený
  nm_sun: Poloha slunce
  nm_fixed: Pevné časy
  t_night_not_before: Noc nejdříve
  t_night_not_after: Noc nejpozději
  t_night_from: Noc od
  t_night_until: Noc do
  t_fx_dur: Doba trvání efektu
  t_blink_cycle: Cyklus blikání
  t_tin_min: Vnitřní teplota min
  t_tin_max: Vnitřní teplota max
  t_tout_min: Venkovní teplota min
  t_tout_max: Venkovní teplota max
  t_col_time: Barva času
  t_col_vent: Zobrazit VĚTRAT
  t_col_alarm: Zobrazit ALARM
  t_col_battery: Zobrazit AKU
  t_col_tout: Zobrazit venkovní teplotu
  t_col_tin: Zobrazit vnitřní teplotu
  t_sw_min: Zobrazit jednotlivé minuty
  t_sw_extra: Zobrazit ČAS LETÍ
  t_fx: Efekt
  t_fx_color: Barva efektu
  t_fx_start: Spustit efekt
  t_fx_stop: Zastavit efekt
  t_text: Běžící text
  t_text_start: Zobrazit text

  # colour options (palette order, never change the order; c_off = additional display off)
  c_off: "Vyp."
  c_0: Teplá bílá
  c_1: Bílá
  c_2: Červená
  c_3: Oranžová
  c_4: Žlutá
  c_5: Zelená
  c_6: Modrá
  c_7: Fialová
  c_random: Náhodná
  c_temp: Teplota
  c_pride: Pride

  # effect names (order of WC_FX in wc_effects.h)
  fx_rainbow: Duha
  fx_aurora: Polární záře
  fx_matrix: Matrix
  fx_fire: Oheň
  fx_confetti: Konfety
  fx_stars: Hvězdná obloha
  fx_blink: Blikání

esphome:
  includes:
    - ${src_dir}/wc_lang_CZ.h
