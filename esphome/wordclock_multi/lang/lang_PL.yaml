# lang_PL.yaml - Wordclock 16x16, ESPHome language package PL (Polski), v0.9
# Device name, hotspot, location (capital), time zone, entity names and options.
# Grid and time words: ${src_dir}/wc_lang_PL.h (shared with the Arduino variant).
# Every value can be overwritten in wordclock_multi.yaml under substitutions (e.g. name, latitude).
substitutions:
  lang_code: PL
  name: zegarslowny
  friendly_name: ZegarSlowny
  ap_ssid: ZegarSlowny Fallback
  timezone: Europe/Warsaw
  latitude: "52.230°"           # Warszawa
  longitude: "21.012°"
  extra_hidden: "false"         # language has extra words (CZAS LECI), switch shown

  # entity names
  t_br_day: Jasność w dzień
  t_br_night: Jasność w nocy
  t_cur_limit: Limit prądu
  t_night_start: Przesunięcie początku nocy
  t_night_end: Przesunięcie końca nocy
  t_night_mode: Tryb nocny
  nm_mix: Mieszany
  nm_sun: Położenie słońca
  nm_fixed: Stałe godziny
  t_night_not_before: Noc najwcześniej
  t_night_not_after: Noc najpóźniej
  t_night_from: Noc od
  t_night_until: Noc do
  t_fx_dur: Czas trwania efektu
  t_blink_cycle: Cykl migania
  t_tin_min: Temperatura wewnątrz min
  t_tin_max: Temperatura wewnątrz maks
  t_tout_min: Temperatura na zewnątrz min
  t_tout_max: Temperatura na zewnątrz maks
  t_col_time: Kolor godziny
  t_col_vent: Kolor WIETRZ
  t_col_alarm: Kolor ALARM
  t_col_battery: Kolor AKU
  t_col_tout: Kolor temperatury na zewnątrz
  t_col_tin: Kolor temperatury wewnątrz
  t_sw_temp: Pokaż temperaturę
  t_sw_min: Pokaż pojedyncze minuty
  t_sw_alarm: Pokaż alarm
  t_sw_vent: Pokaż wietrzenie
  t_sw_battery: Pokaż akumulator
  t_sw_extra: Pokaż CZAS LECI
  t_fx: Efekt
  t_fx_color: Kolor efektu
  t_fx_start: Uruchom efekt
  t_fx_stop: Zatrzymaj efekt
  t_text: Tekst
  t_text_start: Pokaż tekst

  # colour options (palette order, never change the order)
  c_0: Ciepła biel
  c_1: Biały
  c_2: Czerwony
  c_3: Pomarańczowy
  c_4: Żółty
  c_5: Zielony
  c_6: Niebieski
  c_7: Fioletowy
  c_random: Losowy
  c_temp: Temperatura
  c_pride: Pride

  # effect names (order of WC_FX in wc_effects.h)
  fx_rainbow: Tęcza
  fx_aurora: Zorza polarna
  fx_matrix: Matrix
  fx_fire: Ogień
  fx_confetti: Konfetti
  fx_stars: Gwiaździste niebo
  fx_blink: Miganie

esphome:
  includes:
    - ${src_dir}/wc_lang_PL.h
