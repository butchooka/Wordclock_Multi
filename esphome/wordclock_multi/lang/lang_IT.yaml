# lang_IT.yaml - Wordclock 16x16, ESPHome language package IT (Italiano), v0.9
# Device name, hotspot, location (capital), entity names and options.
# Grid and time words: ${src_dir}/wc_lang_IT.h (shared with the Arduino variant).
# Every value can be overwritten in wordclock_multi.yaml under substitutions (e.g. name, latitude).
substitutions:
  lang_code: IT
  name: orologio
  friendly_name: Orologio
  ap_ssid: Orologio Fallback
  latitude: "41.903°"           # Roma
  longitude: "12.496°"
  extra_hidden: "false"         # language has extra words (CIAO), switch shown

  # entity names
  t_br_day: Luminosità giorno
  t_br_night: Luminosità notte
  t_cur_limit: Limite di corrente
  t_night_start: Scostamento inizio notte
  t_night_end: Scostamento fine notte
  t_night_mode: Modalità notte
  nm_mix: Mista
  nm_sun: Posizione del sole
  nm_fixed: Orari fissi
  t_night_not_before: Notte non prima delle
  t_night_not_after: Notte non dopo le
  t_night_from: Notte dalle
  t_night_until: Notte fino alle
  t_fx_dur: Durata effetto
  t_blink_cycle: Ciclo di lampeggio
  t_tin_min: Temperatura interna min
  t_tin_max: Temperatura interna max
  t_tout_min: Temperatura esterna min
  t_tout_max: Temperatura esterna max
  t_col_time: Colore ora
  t_col_vent: Mostra AERARE
  t_col_alarm: Mostra ALLARME
  t_col_battery: Mostra BATT
  t_col_tout: Mostra temperatura esterna
  t_col_tin: Mostra temperatura interna
  t_sw_min: Mostra minuti singoli
  t_sw_extra: Mostra CIAO
  t_fx: Effetto
  t_fx_color: Colore effetto
  t_fx_start: Avvia effetto
  t_fx_stop: Ferma effetto
  t_text: Testo scorrevole
  t_text_start: Mostra testo

  # colour options (palette order, never change the order; c_off = additional display off)
  c_off: "Spento"
  c_0: Bianco caldo
  c_1: Bianco
  c_2: Rosso
  c_3: Arancione
  c_4: Giallo
  c_5: Verde
  c_6: Blu
  c_7: Viola
  c_random: Casuale
  c_temp: Temperatura
  c_pride: Pride

  # effect names (order of WC_FX in wc_effects.h)
  fx_rainbow: Arcobaleno
  fx_aurora: Aurora
  fx_matrix: Matrix
  fx_fire: Fuoco
  fx_confetti: Coriandoli
  fx_stars: Cielo stellato
  fx_blink: Lampeggio

esphome:
  includes:
    - ${src_dir}/wc_lang_IT.h
