# lang_dialect_CH.yaml - Wordclock 16x16, ESPHome language package dialect_CH (Schwizerdütsch), v2.0
# Device name, hotspot, location (capital), time zone, entity names and options.
# Grid and time words: ${src_dir}/wc_lang_dialect_CH.h (shared with the Arduino variant).
# Every value can be overwritten in wordclock_multi.yaml under substitutions (e.g. name, latitude).
substitutions:
  lang_code: dialect_CH
  name: wortuehrli
  friendly_name: Wortuehrli
  ap_ssid: Wortuehrli Fallback
  timezone: Europe/Zurich
  latitude: "46.948°"           # Bern
  longitude: "7.447°"
  extra_hidden: "false"         # GRÜEZI MITENAND (extra words)

