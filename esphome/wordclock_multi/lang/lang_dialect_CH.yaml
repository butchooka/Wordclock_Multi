  nm_mix: Mischform
  nm_sun: Sonnenstand
  nm_fixed: feste Uhrzeiten
  t_night_not_before: Nacht frühestens ab
  t_night_not_after: Nacht spätestens bis
  t_night_from: Nacht von
  t_night_until: Nacht bis
  t_fx_dur: Effekt Dauer
  t_blink_cycle: Blinken Zyklus
  t_tin_min: Temperatur Innen Min
  t_tin_max: Temperatur Innen Max
  t_tout_min: Temperatur Aussen Min
  t_tout_max: Temperatur Aussen Max
  t_col_time: Farbe Uhrzeit
