  t_fx_stop: Διακοπή εφέ
  t_text: Κυλιόμενο κείμενο
  t_text_start: Εμφάνιση κειμένου

  # colour options (palette order, never change the order; c_off = additional display off)
  c_off: "Όχι"
  c_0: Θερμό λευκό
  c_1: Λευκό
  c_2: Κόκκινο
  c_3: Πορτοκαλί
  c_4: Κίτρινο
  c_5: Πράσινο
  c_6: Μπλε
  c_7: Βιολετί
  c_random: Τυχαίο
  c_temp: Θερμοκρασία
  c_pride: Pride

  # effect names (order of WC_FX in wc_effects.h)
  fx_rainbow: Ουράνιο τόξο
  fx_aurora: Σέλας
  fx_matrix: Matrix
  fx_fire: Φωτιά
  fx_confetti: Κομφετί
  fx_stars: Έναστρος ουρανός
